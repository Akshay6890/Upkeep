name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Core package tests
        working-directory: Packages/UpkeepCore
        run: swift test 2>&1 | tee ../../core-tests.log

      - name: Build app (Debug)
        run: |
          set -o pipefail
          xcodebuild -project Upkeep.xcodeproj -scheme Upkeep -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build 2>&1 | tee app-build.log
          echo "Warnings in app build:"
          grep -E "warning:" app-build.log | grep -v "^ld: warning" | sort -u | tee app-warnings.txt || true
          echo "Warning count: $(wc -l < app-warnings.txt)"

      - name: Test via Xcode scheme
        run: |
          set -o pipefail
          xcodebuild -project Upkeep.xcodeproj -scheme Upkeep \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test 2>&1 | tail -40

      - name: Read-only CLI smoke test against this runner's home
        working-directory: Packages/UpkeepCore
        run: |
          swift run -c release upkeep-cli scan
          swift run -c release upkeep-cli cleanup --dry-run --include-review | tail -25
          if swift run -c release upkeep-cli cleanup; then echo "cleanup without --dry-run must fail"; exit 1; fi

      - name: Build app (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project Upkeep.xcodeproj -scheme Upkeep -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build 2>&1 | tail -5
          codesign --verify --verbose build/Build/Products/Release/Upkeep.app
          ditto -c -k --keepParent build/Build/Products/Release/Upkeep.app Upkeep.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Upkeep-app
          path: Upkeep.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            core-tests.log
            app-build.log
            app-warnings.txt
