<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Upkeep</title>
  <defs>
    <!-- Soft macOS-style drop shadow under the tile -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Very subtle top-to-bottom tone so the tile doesn't look flat at small sizes -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1E24"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </linearGradient>
    <!-- Green leaf, matching the app's accent -->
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BDE9E"/>
      <stop offset="1" stop-color="#5DB463"/>
    </linearGradient>
    <!-- Soft green glow behind the leaf -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5DB463" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5DB463" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile: 824×824 on the 1024 macOS icon grid -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#tile)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" ry="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  </g>

  <circle cx="530" cy="500" r="330" fill="url(#glow)"/>

  <!-- Leaf outline -->
  <g fill="none" stroke="url(#leaf)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 664 C 300 520 402 336 720 300 C 752 470 646 700 372 664 Z"/>
    <!-- Midrib continuing into the stem -->
    <path d="M300 736 C 380 640 470 540 596 432"/>
  </g>
</svg>
